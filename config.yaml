# 达人筛选 skill V2 · 候选配置（内容匹配 × 价格效率 双核心）
#
# ⚠️ 阈值状态：候选规则（基于 77 条真实星图数据第一轮分析），未冻结。
# 与 V1（config_v1.yaml.bak）的关键差异：
#   · 取消「互动率 3% 一票否决」→ 转为质量复核信号
#   · CPM 不再是单一硬门槛 → 分档进入双维矩阵
#   · 新增人工内容标签机制（按星图 ID 补充一级/二级内容方向与证据）
#   · 风险标签按类型分级处理（排除 / 复核 / 提示）

version: "2.0-draft"
评分版本: "2.0-draft"

字段别名:
  昵称: [昵称, 达人昵称, 达人名称, nickname]
  星图id: [星图id, 星图ID, xingtu_id, star_id, 达人id]
  粉丝量: [粉丝量, 粉丝数, 粉丝]
  互动率: [互动率]
  完播率: [完播率]
  女性占比: [女性粉丝比例, 女性占比]
  均播: [预期播放量, 均播, 平均播放量]
  报价: [植入视频报价, 报价, 视频报价]
  定制报价: [定制视频报价]
  赛道: [内容垂类, 内容标签, 赛道, tags]
  标题: [视频标题, 标题, 代表作标题1, 代表作标题2]
  风险标签: [风险标签, risk_tags]
  粉丝增长率: [粉丝增长率]
  近30日视频数: [近30日星图视频数, 近30日视频数]
  星图指数: [星图指数, 任务综合表现得分]
  种草指数: [种草指数]
  预期CPM文本: [预期CPM]
  资深中产: [资深中产粉丝比例]
  新锐白领: [新锐白领粉丝比例]
  主页链接: [达人链接, 主页链接, homepage_url]
  外部五维总分: [五维总分, 总分, total_score]
  外部等级: [等级, 工具等级, grade]

# 硬排除（品牌安全底线，保留 V1 语义）
硬排除:
  粉丝量下限: 1000
  报价区间: [300, 10000]
  检查避雷词: true
避雷词表: [女性成长, 独立女性, 女性力量, 搞钱女孩, 励志, 正能量, 心灵鸡汤,
           人生感悟, 自我提升, 做自己, 励志口播, 觉醒, 逆袭]

# 风险标签分级（类型化处理；未匹配到的未知标签默认按「复核」处理）
风险标签分级:
  排除级: [疑似刷量, 刷量, 数据造假, 舞弊, 违规, 封号, 造假]
  复核级: [资料不全, 数据存疑, 低质标题党, 长期停更, 过度带货, 内容同质化, 内容低质]
  提示级: [新号, 赛道迁移, 涨粉波动]
  未知标签默认级别: 复核
  无效值: [无, 未知, none, nan, "-", ""]

# 复核信号（标记不排除；门槛字段缺失同样只进待复核）
复核信号:
  互动率下限（转复核）: 0.015        # V2：取消 3% 一票否决，低于 1.5% 仅复核
  高互动低完播: {互动率下限: 0.10, 完播率上限: 0.05}
  粉丝负增长: true
  互动率超批内中位数倍数: 5
  互动率上限（异常）: 0.15
  完播率上限（异常）: 0.40
  重算CPM下限（异常）: 5             # 预期播放疑含自然流量
  视频数缺失或为零: true
  视频数缺失比例上限: 0.5

# CPM 分档（候选档位，植入口径 = 植入视频报价 / 预期播放量 × 1000）
CPM分档:
  植入口径: true                     # 优先使用植入口径；预期播放缺失时回退解析预期CPM文本的 20-60s 档
  档位: [[15, "高效"], [20, "良好"], [30, "可谈"], [999999, "低效"]]

# 双维矩阵（内容匹配 × 价格效率）
双维矩阵:
  内容匹配权重: {星图指数: 0.4, 种草指数: 0.3, 垂类基础分: 0.3}
  垂类基础分: 80                     # 无细分证据时的中性基础分
  知识友好垂类加成: 20               # 二级标签命中知识友好方向时叠加（封顶100）
  知识友好二级词: [历史知识, 历史故事, 人文解说, 知识科普, 人文历史, 自然科学, 科普, 历史]
  高匹配阈值: 70
  中匹配阈值: 55
  议价候选匹配阈值: 80               # 低效 CPM 但内容匹配 ≥ 此值 → 议价候选
  P1需二级核验证据: true             # 无人工核验的二级内容证据时，最高只能 P2 并标记「内容细分待核验」

# 五维打分（保留为辅助证据，不再决定最终推荐）
五维打分辅助:
  五维权重: {账号健康度: 0.15, 内容质量分: 0.25, 知乎调性匹配分: 0.25, 互动质量分: 0.20, 数据真实度分: 0.15}
  维度权重:
    账号健康度: {粉丝量: 0.5, 活跃度: 0.5}
    内容质量分: {星图指数: 0.4, 完播率: 0.3, 种草指数: 0.3}
    知乎调性匹配分: {垂类知识性: 0.5, 高知画像: 0.5}
    互动质量分: {互动率: 0.8, 完播率: 0.2}
    数据真实度分: {互动率合理性: 0.4, 粉丝增长率合理性: 0.3, 均播合理性: 0.3}
  粉丝量分段: [[5000000, 100], [1000000, 90], [500000, 80], [100000, 70], [50000, 60], [10000, 50], [0, 30]]
  活跃度分段: [[10, 100], [5, 85], [3, 70], [1, 55], [0, 30]]
  预期播放量分段: [[500000, 100], [200000, 85], [100000, 75], [50000, 65], [10000, 50], [0, 30]]
  完播率满分阈值: 0.30
  互动率满分阈值: 0.08
  垂类基线分: 30
  知识赛道分: 70
  二级知识词: [科普, 知识, 测评, 教学, 人文, 自然, 传统, 科技, 管理, 研究, 解读]
  二级知识词加分: 5
  知识赛道加分上限: 10
  知识友好赛道: [知识科普, 科技数码, 财经商业, 教育学习, 人文读书, 健康医学, 法律普法,
                 艺术文化, 自然科学, 人文, 科学]
  高知画像满分占比: 0.50
  互动率合理区间: [0.005, 0.15]
  粉丝增长率合理区间: [0, 0.2]
  均播刷量阈值: [[100000, 5000], [500000, 10000]]
  不合理分: 50
  高于上限分: 60
  刷量分: 20
  辅助等级阈值: {S: 78, A: 65, B: 50, C: 0}

# 内容标签文件（人工维护，按星图 ID 匹配；可选）
内容标签文件:
  支持列: [星图id, 一级方向, 二级细分, 内容证据, 标签来源, 核验状态]
  核验状态有效值: [已核验, 待核验]
  允许来源: [人工核验, 运营确认, 星图详情页]   # 值为 auto / 自动 的标签不作为 P1 证据

# 存档（评分版本 + 输入指纹 + 结果快照）
存档:
  目录: archive                      # 相对输出文件目录
