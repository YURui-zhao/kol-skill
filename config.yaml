# 达人筛选 skill · v1.0 冻结配置
# 所有阈值集中在此文件，kol_filter.py 不写死任何业务阈值。
# 阈值来源标注见每条注释（v2 = 2026-09-15 已验证并跑通的筛选标准；星图 = 主项目星图模式打分口径）。

version: "1.0"

# ── 输入字段自适应别名：按顺序匹配第一个存在的列；全部不存在则该字段缺失 ──
字段别名:
  昵称: [昵称, 达人昵称, 达人名称, nickname]
  粉丝量: [粉丝量, 粉丝数, 粉丝]
  互动率: [互动率]
  完播率: [完播率]
  女性占比: [女性粉丝比例, 女性占比]
  均播: [预期播放量, 均播, 平均播放量]
  报价: [植入视频报价, 报价, 视频报价]
  赛道: [内容垂类, 内容标签, 赛道, tags]
  标题: [视频标题, 标题, 代表作标题1, 代表作标题2]
  风险标签: [风险标签, risk_tags]
  粉丝增长率: [粉丝增长率]
  近30日视频数: [近30日星图视频数, 近30日视频数]
  星图指数: [星图指数, 任务综合表现得分]
  种草指数: [种草指数]
  资深中产: [资深中产粉丝比例]
  新锐白领: [新锐白领粉丝比例]
  主页链接: [达人链接, 主页链接, homepage_url]
  等级: [等级, 工具等级, grade]
  五维总分: [五维总分, 总分, total_score]

# ── 硬门槛（来源：v2 已验证标准，2026-09-15） ──
硬门槛:
  粉丝量下限: 1000          # v2：粉丝 > 1000
  互动率下限: 0.03          # v2（旧版 0.05，2026-09-15 放宽到 0.03）
  CPM上限: 30               # v2：CPM < 30
  均播下限: 10000           # v2：近期均播 > 1 万
  报价区间: [300, 10000]    # v2（旧版上限 5000，2026-09-15 放宽到 10000）
  检查避雷词: true
  检查风险标签: true

# ── 避雷词表（来源：主项目 configs/default.yaml tagging.星图模式.避雷词表） ──
避雷词表: [女性成长, 独立女性, 女性力量, 搞钱女孩, 励志, 正能量, 心灵鸡汤,
           人生感悟, 自我提升, 做自己, 励志口播, 觉醒, 逆袭]

# ── 加分项（来源：v2 标准。只用于同梯队内排序，不改变梯队归属） ──
加分项:
  女性占比: {高分阈值: 70, 高分加分: 20, 低分阈值: 60, 低分加分: 10}
  内容形态加分: 15
  内容形态加分形态: [情感故事, 实用干货, 人性洞察, 历史八卦, 财经, 职场技巧]   # v2：这些形态才加分
  标题词加分: 10
  标题场景词: [为什么, 如何, 怎么, 必须知道, 潜规则, 避坑, 真相, 揭秘, 干货, 教程, 指南]
  互动率: {第一档阈值: 10, 第一档加分: 15, 第二档阈值: 8, 第二档加分: 10}
  完播率阈值: 10            # 完播率 > 10% → 加分
  完播率加分: 10
  价格带: [[500, 1500], [3000, 5000]]   # 落在这两个价格带内 → 加分
  价格带加分: 5
  赛道关键词: [财经, 历史, 成长, 职场, 教育, 情感, 影视, 娱乐, 故事, 人文, 读书, 科普, 知识, 图文]
  赛道加分: 5

# ── 内容形态词表（来源：v2 脚本 FORM_RULES） ──
内容形态词表:
  情感故事: [情感, 婚姻, 夫妻, 恋爱, 分手, 家庭, 亲情, 心理测试]
  历史八卦: [历史, 皇帝, 朝代, 野史, 太后, 古代, 战役]
  职场技巧: [职场, 面试, 领导, 老板, 同事, 管理, 升职, 简历]
  财经: [财经, 投资, 理财, 股票, 基金, 商业, 经济, 财报]
  人性洞察: [人性, 认知, 思维, 本质, 智慧, 成长]
  实用干货: [科学, 自然, 知识, 教育, 学习, 技能, 科普, 艺术文化, 人文]

# ── 梯队规则（来源：本次修复的问题 1——排序口径） ──
# 梯队由五维分等级决定；加分项只在同梯队内排序，不允许跨梯队逆袭。
梯队规则:
  依据: 等级
  等级到梯队:
    S: 第一梯队-强烈推荐
    A: 第一梯队-强烈推荐
    B: 第二梯队-推荐
    C: 第三梯队-可考虑
  互动率区间: {第一梯队: 8, 第二梯队: 5}   # 仅用于展示「互动率档位」，不参与梯队划分

# ── 五维打分与等级（来源：主项目星图模式，简化为绝对分档，不依赖批内归一化） ──
五维打分:
  五维权重: {账号健康度: 0.15, 内容质量分: 0.25, 知乎调性匹配分: 0.25, 互动质量分: 0.20, 数据真实度分: 0.15}
  维度权重:
    账号健康度: {粉丝量: 0.5, 活跃度: 0.5}
    内容质量分: {星图指数: 0.4, 完播率: 0.3, 种草指数: 0.3}
    知乎调性匹配分: {垂类知识性: 0.5, 高知画像: 0.5}
    互动质量分: {互动率: 0.8, 完播率: 0.2}
    数据真实度分: {互动率合理性: 0.4, 粉丝增长率合理性: 0.3, 均播合理性: 0.3}
  粉丝量分段: [[5000000, 100], [1000000, 90], [500000, 80], [100000, 70], [50000, 60], [10000, 50], [0, 30]]
  活跃度分段: [[10, 100], [5, 85], [3, 70], [1, 55], [0, 30]]
  预期播放量分段: [[500000, 100], [200000, 85], [100000, 75], [50000, 65], [10000, 50], [0, 30]]
  完播率满分阈值: 0.30        # 完播率 ≥ 30% 记满分
  互动率满分阈值: 0.08        # 星图模式：互动率 ≥ 8% 记满分
  垂类基线分: 30
  知识赛道分: 70
  二级知识词: [科普, 知识, 测评, 教学, 人文, 自然, 传统, 科技, 管理, 研究, 解读]
  二级知识词加分: 5
  知识赛道加分上限: 10
  知识友好赛道: [知识科普, 科技数码, 财经商业, 教育学习, 人文读书, 健康医学, 法律普法,
                 艺术文化, 自然科学, 人文, 科学]
  高知画像满分占比: 0.50      # 资深中产 + 新锐白领 ≥ 50% 记满分
  互动率合理区间: [0.005, 0.15]
  粉丝增长率合理区间: [0, 0.2]
  均播刷量阈值: [[100000, 5000], [500000, 10000]]   # 粉丝≥左值 且 均播<右值 → 真实度记 20
  不合理分: 50
  高于上限分: 60
  刷量分: 20
  等级阈值: {S: 78, A: 65, B: 50, C: 0}   # 星图模式独立阈值（来源：configs/default.yaml）

# ── 异常复核信号（来源：本次修复的问题 2；只标记，不排除） ──
复核信号:
  高互动低完播: {互动率下限: 0.10, 完播率上限: 0.05}
  粉丝负增长: true
  视频数缺失或为零: true
  视频数缺失比例上限: 0.5              # 该列空缺率超过此比例＝数据源根本不提供，改为全局提示一次，避免逐行刷屏
  互动率超批内中位数倍数: 5
  关键指标单元格缺失: [互动率]         # 该列存在但某行为空 → 标记复核（沿用「标记不排除」原则）
